<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusCut AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0f;
            color: #e0e0f0;
            min-height: 100vh;
            padding: 16px;
        }
        .header {
            background: linear-gradient(135deg, #6c5ce7, #4a3db5);
            padding: 24px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 { font-size: 24px; color: white; }
        .header p { font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 4px; }

        .upload-zone {
            border: 2px dashed #6c5ce7;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            background: #14141f;
            margin-bottom: 16px;
            transition: all 0.3s;
        }
        .upload-zone:active { transform: scale(0.98); }
        .upload-zone .icon { font-size: 48px; }
        .upload-zone .text { font-size: 16px; font-weight: 600; margin-top: 8px; }
        .upload-zone .sub { font-size: 12px; color: #8888aa; margin-top: 4px; }

        .files-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .file-chip {
            background: #14141f;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .file-chip .remove { color: #e74c3c; cursor: pointer; font-weight: bold; }

        .chat-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .chat-row input {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid #2a2a3a;
            background: #14141f;
            color: #e0e0f0;
            font-size: 15px;
        }
        .chat-row button {
            padding: 14px 20px;
            border-radius: 14px;
            background: #6c5ce7;
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }
        .chat-row button:disabled { opacity: 0.5; }

        .messages { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .message {
            padding: 12px 16px;
            border-radius: 14px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-line;
        }
        .message.ai { background: #14141f; align-self: flex-start; }
        .message.user { background: #6c5ce7; align-self: flex-end; color: white; }

        .section-title { font-size: 16px; font-weight: 700; margin: 20px 0 12px; }

        .project-card {
            background: #14141f;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .project-card .title { font-weight: 600; }
        .project-card .meta { font-size: 12px; color: #8888aa; margin-top: 4px; }
        .project-card .btn {
            width: 40px; height: 40px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .btn.play { background: #6c5ce7; color: white; }
        .btn.delete { background: rgba(231,76,60,0.2); color: #e74c3c; }

        .status { font-size: 11px; padding: 4px 10px; border-radius: 10px; font-weight: 600; }
        .status.ready { background: rgba(46,204,113,0.2); color: #2ecc71; }
        .status.analyzing { background: rgba(241,196,15,0.2); color: #f1c40f; }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #6c5ce7; color: white; padding: 12px 24px;
            border-radius: 20px; font-weight: 600; z-index: 999;
        }

        .spinner {
            display: inline-block; width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎬 NexusCut AI</h1>
        <p>Умный видеомонтаж в Telegram</p>
    </div>

    <div class="upload-zone" id="uploadZone">
        <div class="icon">📤</div>
        <div class="text">Загрузи видео или фото</div>
        <div class="sub">До 10 видео по 60 сек</div>
    </div>
    <input type="file" id="fileInput" multiple accept="video/*,image/*" style="display:none">

    <div class="files-list" id="filesList"></div>

    <div class="chat-row">
        <input type="text" id="promptInput" placeholder="Что делаем с видео?">
        <button id="sendBtn" onclick="sendPrompt()">➤</button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="section-title">📂 Мои проекты</div>
    <div id="projectsList">
        <div style="color:#8888aa;text-align:center;padding:20px;">Загрузка...</div>
    </div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    // ЗАМЕНИ НА СВОЙ URL
    const API_URL = "https://scruffy-snowsuit-faculty.ngrok-free.dev";
    let uploadedFiles = [];

    loadProjects();

    document.getElementById('uploadZone').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('fileInput').onchange = (e) => {
        for (let f of e.target.files) {
            if (uploadedFiles.length >= 10) break;
            uploadedFiles.push(f);
        }
        renderFiles();
    };

    function renderFiles() {
        document.getElementById('filesList').innerHTML = uploadedFiles.map((f, i) => `
            <div class="file-chip">${f.name.slice(0,20)} <span class="remove" onclick="uploadedFiles.splice(${i},1);renderFiles()">✕</span></div>
        `).join('');
    }

    function addMessage(text, type) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.textContent = text;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }

    async function sendPrompt() {
        const prompt = document.getElementById('promptInput').value.trim();
        if (!prompt || uploadedFiles.length === 0) {
            if (!prompt) addMessage('Напиши что сделать с видео', 'ai');
            if (uploadedFiles.length === 0) addMessage('Загрузи хотя бы одно видео', 'ai');
            return;
        }

        addMessage(prompt, 'user');
        document.getElementById('promptInput').value = '';

        const btn = document.getElementById('sendBtn');
        btn.disabled = true;

        const file = uploadedFiles[0];
        const formData = new FormData();
        formData.append('file', file);

        try {
            addMessage('⏳ Загружаю видео на сервер...', 'ai');
            const uploadRes = await fetch(`${API_URL}/upload`, { method: 'POST', body: formData });
            const uploadData = await uploadRes.json();
            const projectId = uploadData.project_id;

            addMessage('🔬 Анализирую видео (это может занять минуту)...', 'ai');

            const analyzeForm = new FormData();
            analyzeForm.append('prompt', prompt);
            const analyzeRes = await fetch(`${API_URL}/analyze/${projectId}`, { method: 'POST', body: analyzeForm });
            const analyzeData = await analyzeRes.json();

            if (analyzeData.status === 'done') {
                const a = analyzeData.analysis;
                const typeNames = {
                    'sport_goal': '⚽ Спорт/Голы', 'event_cake': '🎂 Праздник',
                    'pet_moment': '🐱 Животные', 'conversation': '💬 Разговор',
                    'dance_music': '💃 Танцы', 'random_life': '🎬 Обычное видео'
                };

                let response = `✅ Проанализировал "${file.name}"\n\n`;
                response += `📹 Тип: ${typeNames[a.video_type] || a.video_type}\n`;
                response += `⏱ Длительность: ${a.duration?.toFixed(0)}с\n`;
                response += `🗣 Язык: ${a.language}\n`;
                response += `🔥 Событий: ${a.events?.length || 0}\n`;
                response += `👤 Лиц: ${a.faces_total || 0}\n`;

                if (a.events?.length > 0) {
                    response += `\n🎯 События:\n`;
                    a.events.slice(0,3).forEach(e => {
                        response += `  • ${e.start?.toFixed(0)}с: ${e.description?.slice(0,50)}\n`;
                    });
                }

                if (a.scenarios?.length > 0) {
                    response += `\n📋 Варианты:\n`;
                    a.scenarios.slice(0,4).forEach((s, i) => {
                        response += `${i+1}. ${s.title}\n   ${s.description}\n`;
                    });
                }

                response += `\n⚠️ Монтаж будет доступен в следующем обновлении.`;

                addMessage(response, 'ai');
                addProjectCard(file.name, a, projectId);
            } else {
                addMessage('❌ Ошибка анализа', 'ai');
            }
        } catch (e) {
            console.error(e);
            addMessage('❌ Сервер недоступен. Попробуй позже.', 'ai');
        }

        uploadedFiles = [];
        renderFiles();
        btn.disabled = false;
    }

    async function loadProjects() {
        try {
            const res = await fetch(`${API_URL}/projects`);
            const data = await res.json();
            const list = document.getElementById('projectsList');
            list.innerHTML = '';

            if (data.projects.length === 0) {
                list.innerHTML = '<div style="color:#8888aa;text-align:center;padding:20px;">Пока пусто</div>';
                return;
            }

            data.projects.forEach(p => {
                list.appendChild(createProjectCard(p));
            });
        } catch(e) {
            document.getElementById('projectsList').innerHTML = 
                '<div style="color:#e74c3c;text-align:center;padding:20px;">Сервер недоступен</div>';
        }
    }

    function addProjectCard(name, analysis, id) {
        const list = document.getElementById('projectsList');
        const empty = list.querySelector('div[style]');
        if (empty) empty.remove();

        const card = createProjectCard({
            id: id,
            filename: name,
            status: 'analyzed',
            analysis: analysis,
            created: new Date().toISOString()
        });

        list.insertBefore(card, list.firstChild);
    }

    function createProjectCard(p) {
        const typeEmoji = p.analysis ? {
            'sport_goal': '⚽', 'event_cake': '🎂', 'pet_moment': '🐱',
            'conversation': '💬', 'dance_music': '💃'
        }[p.analysis.video_type] || '🎬' : '🎬';

        const div = document.createElement('div');
        div.className = 'project-card';
        div.id = `proj-${p.id}`;
        div.innerHTML = `
            <div>
                <div class="title">${typeEmoji} ${p.filename?.slice(0,25)}</div>
                <div class="meta">
                    ${p.analysis?.duration?.toFixed(0) || '?'}с • 
                    <span class="status ${p.status === 'analyzed' ? 'ready' : 'analyzing'}">${p.status === 'analyzed' ? 'Готово' : 'Анализ...'}</span>
                </div>
            </div>
            <div style="display:flex;gap:8px;">
                <button class="btn play" onclick="alert('Монтаж будет доступен скоро! 🚀')">▶</button>
                <button class="btn delete" onclick="deleteProject('${p.id}')">🗑</button>
            </div>`;
        return div;
    }

    async function deleteProject(id) {
        try {
            await fetch(`${API_URL}/projects/${id}`, { method: 'DELETE' });
            const card = document.getElementById(`proj-${id}`);
            if (card) card.remove();

            const list = document.getElementById('projectsList');
            if (list.children.length === 0) {
                list.innerHTML = '<div style="color:#8888aa;text-align:center;padding:20px;">Пока пусто</div>';
            }
        } catch(e) {}
    }

    document.getElementById('promptInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') sendPrompt();
    });

    setTimeout(() => addMessage('Привет! 👋 Загрузи видео и напиши что сделать. ИИ проанализирует и предложит варианты монтажа!', 'ai'), 300);
</script>
</body>
</html>
