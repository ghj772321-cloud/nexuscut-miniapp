<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NexusCut AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #06060c;
            --surface: #0f0f1a;
            --surface2: #181828;
            --primary: #7c3aed;
            --primary-glow: rgba(124, 58, 237, 0.4);
            --accent: #a78bfa;
            --text: #e8e8f0;
            --text2: #9898b0;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --radius: 18px;
            --radius-sm: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            background-image: 
                radial-gradient(ellipse at 20% 0%, rgba(124, 58, 237, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(124, 58, 237, 0.05) 0%, transparent 50%);
        }

        .glass {
            background: rgba(15, 15, 26, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .header {
            background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 50%, #4c1d95 100%);
            padding: 28px 20px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            animation: headerGlow 4s ease-in-out infinite;
        }
        @keyframes headerGlow {
            0%, 100% { transform: translate(0,0); }
            50% { transform: translate(10px,-10px); }
        }
        .header-content { position: relative; z-index: 1; }
        .logo {
            width: 56px; height: 56px;
            background: rgba(255,255,255,0.15);
            border-radius: 16px;
            margin: 0 auto 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .header h1 {
            font-size: 26px;
            font-weight: 800;
            color: white;
            letter-spacing: -0.5px;
        }
        .header .badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            margin-top: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .container { padding: 16px; }

        .upload-zone {
            padding: 36px 20px;
            border: 2px dashed rgba(124, 58, 237, 0.4);
            border-radius: var(--radius);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .upload-zone::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(124,58,237,0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .upload-zone:active {
            transform: scale(0.98);
            border-color: var(--primary);
        }
        .upload-zone:active::after { opacity: 1; }
        .upload-zone .icon {
            font-size: 44px;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 12px var(--primary-glow));
        }
        .upload-zone .text {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
        }
        .upload-zone .sub {
            font-size: 12px;
            color: var(--text2);
            margin-top: 4px;
        }

        .files-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0;
        }
        .file-chip {
            background: var(--surface2);
            padding: 10px 14px;
            border-radius: 24px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.05);
            animation: slideUp 0.3s ease;
        }
        .file-chip .remove {
            color: var(--danger);
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            width: 20px; height: 20px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .file-chip .remove:active { background: rgba(239,68,68,0.2); }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-section { margin: 16px 0; }
        .chat-row {
            display: flex;
            gap: 8px;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 6px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .chat-row input {
            flex: 1;
            padding: 12px 14px;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 15px;
            outline: none;
        }
        .chat-row input::placeholder { color: var(--text2); }
        .chat-row button {
            width: 48px; height: 48px;
            border-radius: 14px;
            background: var(--primary);
            color: white;
            border: none;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
            box-shadow: 0 4px 16px var(--primary-glow);
        }
        .chat-row button:active { transform: scale(0.93); }
        .chat-row button:disabled { opacity: 0.4; box-shadow: none; }

        .messages {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 16px 0;
            max-height: 45vh;
            overflow-y: auto;
            padding-right: 4px;
        }
        .message {
            padding: 14px 16px;
            border-radius: 18px;
            max-width: 88%;
            font-size: 14px;
            line-height: 1.6;
            animation: slideUp 0.35s ease;
            word-break: break-word;
            white-space: pre-line;
        }
        .message.ai {
            background: var(--surface);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .message.user {
            background: linear-gradient(135deg, #7c3aed, #5b21b6);
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            color: white;
        }
        .message .time {
            font-size: 10px;
            opacity: 0.5;
            margin-top: 6px;
            text-align: right;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 24px 0 12px;
        }

        .project-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.04);
            transition: all 0.2s;
            animation: slideUp 0.3s ease;
        }
        .project-card:active { background: var(--surface2); }
        .project-thumb {
            width: 48px; height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        .project-info { flex: 1; min-width: 0; }
        .project-title {
            font-weight: 700;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .project-meta {
            font-size: 12px;
            color: var(--text2);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .status-ready { background: rgba(34,197,94,0.15); color: var(--success); }
        .status-processing { background: rgba(245,158,11,0.15); color: var(--warning); }
        .project-actions { display: flex; gap: 6px; }
        .btn-icon {
            width: 38px; height: 38px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-play { background: var(--primary); color: white; }
        .btn-delete { background: rgba(239,68,68,0.15); color: var(--danger); }
        .btn-icon:active { transform: scale(0.9); }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface2);
            color: var(--text);
            padding: 14px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            z-index: 999;
            animation: slideUp 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            white-space: nowrap;
        }

        .empty-state {
            text-align: center;
            padding: 32px 20px;
            color: var(--text2);
        }
        .empty-state .icon { font-size: 40px; margin-bottom: 10px; opacity: 0.5; }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-content">
            <div class="logo">🎬</div>
            <h1>NexusCut</h1>
            <div class="badge">✦ AI Video Editor</div>
        </div>
    </div>

    <div class="container">
        <div class="upload-zone glass" id="uploadZone">
            <div class="icon">📤</div>
            <div class="text">Загрузи видео или фото</div>
            <div class="sub">До 10 файлов • Макс 60 секунд</div>
        </div>
        <input type="file" id="fileInput" multiple accept="video/*,image/*" style="display:none">

        <div class="files-list" id="filesList"></div>

        <div class="chat-section">
            <div class="chat-row">
                <input type="text" id="promptInput" placeholder="Что сделать с видео?">
                <button id="sendBtn" onclick="sendPrompt()">
                    <span id="sendIcon">↑</span>
                </button>
            </div>
        </div>

        <div class="messages" id="messages"></div>

        <div class="section-title">📂 Проекты</div>
        <div id="projectsList">
            <div class="empty-state">
                <div class="icon">🎞</div>
                <div>Пока нет проектов</div>
            </div>
        </div>
    </div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.setBackgroundColor('#06060c'); }

    const API_URL = "https://f2e59d22520174a7-87-239-135-53.serveousercontent.com";
    let uploadedFiles = [];
    let isProcessing = false;

    loadProjects();

    document.getElementById('uploadZone').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('fileInput').onchange = (e) => {
        for (let f of e.target.files) {
            if (uploadedFiles.length >= 10) { showToast('Максимум 10 файлов'); break; }
            uploadedFiles.push(f);
        }
        renderFiles();
        document.getElementById('fileInput').value = '';
    };

    const zone = document.getElementById('uploadZone');
    zone.ondragover = (e) => { e.preventDefault(); };
    zone.ondrop = (e) => {
        e.preventDefault();
        for (let f of e.dataTransfer.files) {
            if (uploadedFiles.length >= 10) break;
            uploadedFiles.push(f);
        }
        renderFiles();
    };

    function renderFiles() {
        document.getElementById('filesList').innerHTML = uploadedFiles.map((f, i) => `
            <div class="file-chip">
                ${f.type.startsWith('video/') ? '🎬' : '📷'} ${f.name.slice(0,22)}
                <span class="remove" onclick="uploadedFiles.splice(${i},1);renderFiles()">×</span>
            </div>
        `).join('');
    }

    function addMessage(text, type) {
        const container = document.getElementById('messages');
        const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.innerHTML = `${text}<div class="time">${time}</div>`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    async function sendPrompt() {
        if (isProcessing) return;
        const prompt = document.getElementById('promptInput').value.trim();
        if (!prompt || uploadedFiles.length === 0) {
            showToast(prompt ? 'Загрузи видео' : 'Напиши запрос');
            return;
        }

        addMessage(prompt, 'user');
        document.getElementById('promptInput').value = '';
        isProcessing = true;

        const file = uploadedFiles[0];
        const formData = new FormData();
        formData.append('file', file);

        try {
            addMessage('⏳ Загружаю на сервер...', 'ai');
            const uploadRes = await fetch(API_URL + '/upload', { method: 'POST', body: formData });
            const uploadData = await uploadRes.json();
            const projectId = uploadData.project_id;

            addMessage('🔬 Анализирую видео...', 'ai');
            const analyzeForm = new FormData();
            analyzeForm.append('prompt', prompt);
            const analyzeRes = await fetch(API_URL + '/analyze/' + projectId, { method: 'POST', body: analyzeForm });
            const analyzeData = await analyzeRes.json();

            if (analyzeData.status === 'done') {
                const a = analyzeData.analysis;
                let r = `✅ Готово!\n📹 ${a.type_name || a.video_type}\n⏱ ${a.duration?.toFixed(0)}с`;
                if (a.language && a.language !== 'unknown') r += ` • 🗣 ${a.language}`;
                if (a.events?.length) {
                    r += '\n🎯 События:';
                    a.events.slice(0,4).forEach(e => r += `\n  ${e.start?.toFixed(0)}-${e.end?.toFixed(0)}с: ${e.description?.slice(0,40)}`);
                }
                if (a.scenarios?.length) {
                    r += '\n📋 Варианты:';
                    a.scenarios.slice(0,3).forEach((s,i) => r += `\n${i+1}. ${s.title}: ${s.description}`);
                }
                r += '\n⚠️ Монтаж скоро';
                addMessage(r, 'ai');
                addProjectCard(file.name, a, projectId);
            } else {
                addMessage('❌ Ошибка: ' + (analyzeData.error || 'неизвестно'), 'ai');
            }
        } catch (e) {
            addMessage('❌ Сервер недоступен. ' + e.message, 'ai');
        }

        uploadedFiles = [];
        renderFiles();
        isProcessing = false;
    }

    async function loadProjects() {
        try {
            const res = await fetch(API_URL + '/projects');
            const data = await res.json();
            const list = document.getElementById('projectsList');
            list.innerHTML = '';
            if (!data.projects.length) {
                list.innerHTML = '<div class="empty-state"><div class="icon">🎞</div><div>Пока нет проектов</div></div>';
                return;
            }
            data.projects.forEach(p => list.appendChild(createProjectCard(p)));
        } catch(e) {}
    }

    function addProjectCard(name, analysis, id) {
        const list = document.getElementById('projectsList');
        if (list.querySelector('.empty-state')) list.innerHTML = '';
        list.insertBefore(createProjectCard({id, filename:name, status:'analyzed', analysis}), list.firstChild);
    }

    function createProjectCard(p) {
        const colors = {
            sport_goal:'rgba(59,130,246,0.2)',event_cake:'rgba(236,72,153,0.2)',
            pet_moment:'rgba(34,197,94,0.2)',conversation:'rgba(168,85,247,0.2)',
            dance_music:'rgba(251,146,60,0.2)',social_clip:'rgba(124,58,237,0.2)'
        };
        const emojis = {
            sport_goal:'⚽',event_cake:'🎂',pet_moment:'🐱',
            conversation:'💬',dance_music:'💃',image:'📷'
        };
        const vt = p.analysis?.video_type || 'standard';
        const bg = colors[vt] || 'rgba(124,58,237,0.2)';
        const em = emojis[vt] || '🎬';

        const div = document.createElement('div');
        div.className = 'project-card';
        div.id = 'proj-' + p.id;
        div.innerHTML = `
            <div class="project-thumb" style="background:${bg}">${em}</div>
            <div class="project-info">
                <div class="project-title">${p.filename?.slice(0,30)}</div>
                <div class="project-meta">
                    ${p.analysis?.duration?.toFixed(0)||'?'}с
                    <span class="status-badge status-ready">Готово</span>
                </div>
            </div>
            <div class="project-actions">
                <button class="btn-icon btn-play" onclick="showToast('Монтаж скоро!')">▶</button>
                <button class="btn-icon btn-delete" onclick="deleteProject('${p.id}')">🗑</button>
            </div>`;
        return div;
    }

    async function deleteProject(id) {
        try { await fetch(API_URL + '/projects/' + id, { method: 'DELETE' }); } catch(e) {}
        const card = document.getElementById('proj-' + id);
        if (card) { card.remove(); if (!document.getElementById('projectsList').children.length) document.getElementById('projectsList').innerHTML = '<div class="empty-state"><div class="icon">🎞</div><div>Пока нет проектов</div></div>'; }
    }

    function showToast(text) {
        const t = document.createElement('div');
        t.className = 'toast'; t.textContent = text;
        document.body.appendChild(t);
        setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, 2200);
    }

    document.getElementById('promptInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendPrompt(); });
    setTimeout(() => addMessage('Привет! 👋 Я NexusCut AI. Загрузи видео и напиши что сделать — я проанализирую и предложу варианты!', 'ai'), 400);
</script>
</body>
</html>
